[package]
name = "mnemos_core"
version = "0.2.3"
edition = "2021"
description = "Native core for the Mnemos Hermes memory provider"
license = "MIT"
publish = false

[lib]
name = "mnemos_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
getrandom = "0.2"
hex = "0.4"
hkdf = "0.12"
pyo3 = { version = "0.30", features = ["abi3-py311"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sui-crypto = { version = "0.4", features = ["ed25519", "bech32"] }
sui-rpc = "0.4"
sui-sdk-types = { version = "0.4", features = ["serde", "hash"] }
sui-transaction-builder = "0.4"
prost-types = "0.14"
tonic = { version = "0.14", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[profile.release]
lto = false
codegen-units = 16
