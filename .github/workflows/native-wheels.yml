name: native wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "mnemos-native-v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  wheels:
    name: ${{ matrix.os }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
          - os: macos-15
            target: arm64
          - os: macos-15-intel
            target: x86_64
          - os: windows-2022
            target: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheel
        working-directory: native
        run: |
          python -m pip install "maturin>=1.8,<2"
          maturin build --release --interpreter python -o dist
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: native/dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: native/dist/*.whl

  release:
    needs: wheels
    if: startsWith(github.ref, 'refs/tags/mnemos-native-')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: |
          cd dist
          sha256sum *.whl > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/SHA256SUMS
