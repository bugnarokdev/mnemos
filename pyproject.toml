[project]
name = "hermes-mnemos"
version = "0.2.3"
description = "Sovereign memory provider plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "cryptography>=43,<51",
  "grpcio>=1.70,<2",
  "protobuf>=5,<7",
  "argon2-cffi>=23.1,<26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
